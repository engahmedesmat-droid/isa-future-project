<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#040a1c">
<title>ISA Future Project</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>

<header class="top">
  <button class="brand" id="brandBtn" type="button">
    <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><polygon points="16,2 20,12 30,16 20,20 16,30 12,20 2,16 12,12" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="16" r="3" fill="currentColor"/></svg>
    <span id="brandName">ISA Future Project</span>
  </button>
  <div class="tools">
    <select id="langSel" aria-label="Language">
      <option value="ar">العربية</option>
      <option value="en">English</option>
      <option value="fr">Français</option>
    </select>
    <button class="icon-btn" id="soundBtn" type="button" aria-label="Sound" aria-pressed="true"></button>
    <button class="btn ghost small hidden" id="menuBtn" type="button" data-i18n="menu">Menu</button>
  </div>
</header>

<main>
  <section id="menu" class="menu">
    <div class="hero">
      <h1 data-i18n="title">ISA Future Project</h1>
      <p class="sub" data-i18n="subtitle"></p>
    </div>
    <div class="card">
      <h2 data-i18n="chooseGame"></h2>
      <div class="games" id="optGames"></div>

      <div class="row">
        <div class="field">
          <h3 data-i18n="opponent"></h3>
          <div class="seg" id="optMode"></div>
        </div>
        <div class="field" id="diffField">
          <h3 data-i18n="difficulty"></h3>
          <div class="seg" id="optDiff"></div>
        </div>
      </div>

      <button class="btn primary big" id="playBtn" type="button" data-i18n="play"></button>
    </div>
  </section>

  <section id="game" class="game hidden">
    <div class="boardWrap">
      <svg id="board" viewBox="0 0 1060 640" role="img" aria-label="Backgammon board"></svg>
    </div>

    <aside class="panel">
      <div class="pcard" id="card1">
        <div class="swatch s1"></div>
        <div class="pinfo"><div class="pname" id="name1"></div><div class="pstat"><span id="pips1"></span></div></div>
        <div class="poff" id="off1"></div>
      </div>

      <div class="diceBox">
        <div class="dice" id="dice"></div>
        <div class="status" id="status" aria-live="polite"></div>
        <div class="actions">
          <button class="btn primary" id="rollBtn" type="button"></button>
          <button class="btn ghost" id="undoBtn" type="button"></button>
        </div>
      </div>

      <div class="pcard" id="card0">
        <div class="swatch s0"></div>
        <div class="pinfo"><div class="pname" id="name0"></div><div class="pstat"><span id="pips0"></span></div></div>
        <div class="poff" id="off0"></div>
      </div>

      <details class="rules" open>
        <summary data-i18n="rules"></summary>
        <p id="rulesText"></p>
        <p class="tip" data-i18n="tipClick"></p>
      </details>
    </aside>
  </section>
</main>

<div class="overlay hidden" id="overlay">
  <div class="dialog" role="dialog" aria-modal="true">
    <div class="trophy" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="64" height="64"><polygon points="32,4 40,24 60,32 40,40 32,60 24,40 4,32 24,24" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="32" cy="32" r="6" fill="currentColor"/></svg>
    </div>
    <h2 id="winTitle"></h2>
    <p id="winSub"></p>
    <div class="actions">
      <button class="btn primary" id="rematchBtn" type="button"></button>
      <button class="btn ghost" id="toMenuBtn" type="button"></button>
    </div>
  </div>
</div>

<script src="js/engine.js"></script>
<script src="js/ai.js"></script>
<script src="js/i18n.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
